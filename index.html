<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FitRPG — Le Donjon de la Sueur</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --bg: #0f0c17;
  --panel: #211934;
  --panel-2: #2a2138;
  --border-dark: #14101c;
  --border-light: #4a3f63;
  --ember: #d97757;
  --ember-dark: #a3552f;
  --cream: #f4e9d8;
  --lilac: #c9bfe0;
  --muted: #6b6478;
  --hp: #c0392b;
  --ok: #5fae4f;
  --common: #9a9a9a;
  --rare: #3f8ae0;
  --epic: #a24fe0;
  --legendary: #e0a83f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
html{ background:var(--bg); height:100%; }
html,body{margin:0;padding:0;height:100%; overscroll-behavior:none; }
body{
  background:
    radial-gradient(circle at 18% 15%, rgba(217,119,87,0.16) 0%, transparent 30%),
    radial-gradient(circle at 85% 80%, rgba(217,119,87,0.12) 0%, transparent 32%),
    radial-gradient(circle at 50% 100%, rgba(63,138,224,0.08) 0%, transparent 40%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px),
    radial-gradient(ellipse at top, #1b1428 0%, var(--bg) 60%);
  color:var(--cream);
  font-family:'VT323', 'Courier New', monospace;
  font-size:20px;
  min-height:100%;
  display:flex;
  justify-content:center;
  image-rendering:pixelated;
  animation: torchFlicker 6s ease-in-out infinite;
}
@keyframes torchFlicker{
  0%,100%{ filter:brightness(1); }
  42%{ filter:brightness(1.045); }
  50%{ filter:brightness(0.975); }
  78%{ filter:brightness(1.02); }
}
.pixel-font{ font-family:'Press Start 2P', 'Courier New', monospace; }

#app{
  width:100%;
  max-width:460px;
  min-height:100vh;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
@keyframes screenIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
#app.screen-enter > *{ animation: screenIn 0.3s ease both; }
#app.screen-enter > *:nth-child(2){ animation-delay:0.03s; }
#app.screen-enter > *:nth-child(3){ animation-delay:0.06s; }
#app.screen-enter > *:nth-child(4){ animation-delay:0.09s; }
#app.screen-enter > *:nth-child(5){ animation-delay:0.12s; }

.panel{
  background:linear-gradient(160deg, var(--panel) 0%, #1a1428 100%);
  border:4px solid var(--border-dark);
  box-shadow:
    0 0 0 3px var(--border-light),
    0 10px 26px rgba(0,0,0,0.5),
    inset 0 0 22px rgba(0,0,0,0.28),
    inset 0 1px 0 rgba(255,255,255,0.06);
  padding:16px;
  position:relative;
}
.panel::before, .panel::after{
  content:"";
  position:absolute;
  width:8px; height:8px;
  background:var(--ember);
  box-shadow:0 0 6px rgba(217,119,87,0.8), 0 0 0 2px var(--border-dark);
}
.panel::before{ top:-4px; left:-4px; }
.panel::after{ bottom:-4px; right:-4px; }

h1,h2,h3{ font-family:'Press Start 2P', 'Courier New', monospace; margin:0; line-height:1.5; }
h1{ font-size:16px; color:var(--cream); text-align:center; text-shadow:0 0 10px rgba(217,119,87,0.4), 2px 2px 0 var(--border-dark); }
h2{ font-size:12px; color:var(--ember); margin-bottom:10px; text-shadow:2px 2px 0 var(--border-dark); }
h3{ font-size:10px; color:var(--lilac); }

.topbar{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.topbar .hero-btn{
  background:none; border:none; box-shadow:none; padding:0; cursor:pointer;
  text-align:left; font-family:'VT323', 'Courier New', monospace;
}
.topbar .hero-btn .hero-tag{ font-size:16px; color:var(--cream); text-decoration:underline dotted var(--lilac); }
.topbar .hero-btn .hero-hint{ font-size:11px; color:var(--muted); }
.topbar .level-block{ text-align:right; min-width:120px; }
.topbar .level-badge{
  font-family:'Press Start 2P', 'Courier New', monospace; font-size:10px; color:var(--bg);
  background:var(--ember); padding:6px 8px; border:2px solid var(--border-dark);
  display:inline-block; margin-bottom:6px;
}
.topbar .xp-track{ height:8px; background:var(--border-dark); border:2px solid var(--border-light); overflow:hidden; }
.topbar .xp-text{ font-size:11px; color:var(--muted); margin-top:3px; }

button{
  font-family:'Press Start 2P', 'Courier New', monospace;
  font-size:11px;
  background:linear-gradient(180deg, #e08a63 0%, var(--ember) 55%, var(--ember-dark) 100%);
  color:var(--border-dark);
  border:3px solid var(--border-dark);
  box-shadow:0 0 0 2px var(--ember-dark), 0 4px 0 var(--border-dark), 0 6px 14px rgba(0,0,0,0.35);
  padding:12px 14px;
  cursor:pointer;
  text-align:center;
  position:relative;
  overflow:hidden;
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}
button::after{
  content:""; position:absolute; top:0; left:-60%; width:35%; height:100%;
  background:linear-gradient(115deg, transparent, rgba(255,255,255,0.45), transparent);
  transform:skewX(-18deg); transition:left 0.5s ease;
}
button:hover::after{ left:130%; }
button:active{ transform:translateY(3px); box-shadow:0 0 0 2px var(--ember-dark), 0 1px 0 var(--border-dark); }
button:disabled{ opacity:0.4; cursor:not-allowed; }
button.secondary{ background:linear-gradient(180deg, #362a4d 0%, var(--panel-2) 60%, #201933 100%); color:var(--lilac); box-shadow:0 0 0 2px var(--border-light), 0 4px 0 var(--border-dark), 0 6px 14px rgba(0,0,0,0.35); }
button.block{ width:100%; }

input[type=text], input[type=number]{
  font-family:'VT323', 'Courier New', monospace;
  font-size:20px;
  background:var(--border-dark);
  color:var(--cream);
  border:3px solid var(--border-light);
  padding:10px;
  width:100%;
}

.chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.chip{
  font-size:14px; padding:6px 10px; border:2px solid var(--border-light);
  background:var(--panel-2); color:var(--lilac); cursor:pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.chip:hover{ transform:translateY(-1px); }
.chip.active{ background:linear-gradient(180deg, #e08a63, var(--ember)); color:var(--border-dark); border-color:var(--ember-dark); font-weight:bold; box-shadow:0 0 10px rgba(217,119,87,0.55); }

.bar-track{ height:16px; background:var(--border-dark); border:2px solid var(--border-light); position:relative; overflow:hidden; box-shadow:inset 0 2px 4px rgba(0,0,0,0.5); }
.bar-track::after{
  content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
  animation: barShine 2.6s linear infinite;
}
@keyframes barShine{ from{ left:-60%; } to{ left:130%; } }
.bar-fill{ height:100%; transition:width 0.35s steps(12); }
.bar-fill.hp{ background:repeating-linear-gradient(90deg, var(--hp) 0 8px, #d94a3c 8px 10px); }
.bar-fill.xp{ background:repeating-linear-gradient(90deg, var(--ember) 0 8px, #e08a63 8px 10px); }
.bar-fill.progress{ background:repeating-linear-gradient(90deg, var(--ok) 0 8px, #79c76a 8px 10px); }

.category-card{ margin-bottom:12px; }
.category-card .row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.dots-btn{
  background:var(--panel-2); border:2px solid var(--border-light); color:var(--lilac);
  font-family:'Press Start 2P', 'Courier New', monospace; font-size:12px; padding:6px 10px; cursor:pointer; line-height:1;
}
.dungeon-btn{ width:100%; text-align:left; background:var(--panel-2); border:2px solid var(--border-light); padding:10px; cursor:pointer; }
.dungeon-btn:hover{ border-color:var(--ember); }
.dungeon-btn .name{ font-size:16px; color:var(--cream); }
.dungeon-btn .meta{ font-size:13px; color:var(--muted); }

.monster-frame{
  text-align:center; padding:20px; border:3px solid var(--border-light);
  background:
    radial-gradient(circle at 50% 30%, rgba(217,119,87,0.16) 0%, transparent 55%),
    radial-gradient(ellipse at center, var(--panel-2) 0%, var(--panel) 100%);
  position:relative; overflow:hidden;
}
.monster-frame::before{
  content:""; position:absolute; inset:0;
  background: repeating-linear-gradient(90deg, rgba(0,0,0,0.12) 0 2px, transparent 2px 26px);
  pointer-events:none; opacity:0.5;
}
.monster-frame.boss{ border-color:var(--ember); box-shadow:0 0 0 3px rgba(217,119,87,0.3), 0 0 26px rgba(217,119,87,0.25); }
.monster-frame canvas{ margin-bottom:12px; position:relative; z-index:1; animation: monsterBob 1s ease-in-out infinite; }
.monster-frame.hit-active canvas{ animation:none; filter:brightness(2.4) saturate(0) drop-shadow(0 0 14px #fff); }
@keyframes monsterBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }
.monster-name{ font-family:'Press Start 2P', 'Courier New', monospace; font-size:13px; color:var(--cream); margin-bottom:10px; text-shadow:2px 2px 0 var(--border-dark); }
.hp-label{ font-size:14px; color:var(--lilac); margin-top:6px; }
.dmg-popup{
  position:absolute; top:36%; left:50%; transform:translateX(-50%);
  font-family:'Press Start 2P', 'Courier New', monospace; font-size:14px; color:#fff; z-index:2;
  text-shadow: 0 0 8px var(--ember), 2px 2px 0 var(--border-dark);
  animation: dmgFloat 0.65s ease-out forwards;
}
@keyframes dmgFloat{ 0%{ opacity:0; transform:translate(-50%,10px) scale(0.7); } 25%{ opacity:1; transform:translate(-50%,-6px) scale(1.15); } 100%{ opacity:0; transform:translate(-50%,-38px) scale(1); } }

.timer{ font-family:'Press Start 2P', 'Courier New', monospace; font-size:20px; color:var(--cream); text-align:center; text-shadow:2px 2px 0 var(--border-dark); }
.timer.low{ color:var(--hp); animation: timerPulse 0.6s ease-in-out infinite; }
@keyframes timerPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }

.item-row{ display:flex; justify-content:space-between; align-items:center; padding:10px; background:var(--panel-2); border:2px solid; margin-bottom:8px; }
.item-icon{ width:32px; height:32px; flex:0 0 auto; }
.chip .item-icon{ width:24px; height:24px; }
.rarity-tag{ font-family:'Press Start 2P', 'Courier New', monospace; font-size:9px; padding:4px 6px; }

.modal-overlay{
  position:fixed; inset:0; background:rgba(10,8,15,0.85); display:flex;
  align-items:flex-end; justify-content:center; z-index:50;
}
.modal-sheet{
  background:var(--panel); width:100%; max-width:460px; max-height:80vh;
  overflow-y:auto; border:4px solid var(--border-dark); box-shadow:0 0 0 3px var(--border-light);
  padding:16px;
}
.list-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border-light); font-size:15px; }
.status-dot{ font-size:12px; font-family:'Press Start 2P', 'Courier New', monospace; }
.status-done{ color:var(--ok); } .status-open{ color:var(--ember); } .status-locked{ color:var(--muted); }

.muted{ color:var(--muted); font-size:14px; }
.center{ text-align:center; }
.gap{ display:flex; flex-direction:column; gap:10px; }
.row-between{ display:flex; justify-content:space-between; align-items:center; }
.small{ font-size:14px; }
.footer-note{ font-size:12px; color:var(--muted); text-align:center; margin-top:auto; padding-top:10px; }
.daily-bar{
  background:linear-gradient(160deg, var(--panel) 0%, #1a1428 100%); border:3px solid var(--border-light); padding:12px 14px;
  display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:auto;
  box-shadow:0 6px 16px rgba(0,0,0,0.4);
}
.daily-bar.claimed{ border-color:var(--ok); box-shadow:0 0 14px rgba(95,174,79,0.35); }
.daily-bar .daily-icon{ font-size:26px; width:32px; height:28px; flex:0 0 auto; }
.daily-bar .daily-title{ font-family:'Press Start 2P', 'Courier New', monospace; font-size:10px; color:var(--cream); margin-bottom:4px; }
.daily-bar .daily-sub{ font-size:13px; color:var(--muted); }
.daily-bar .daily-sub.claimed{ color:var(--ok); border:none; }
canvas.pixel-canvas{
  image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges;
  display:block; margin:0 auto;
}
.creation-layout{ display:flex; gap:16px; align-items:flex-start; }
.creation-preview{
  flex:0 0 auto;
  background:radial-gradient(ellipse at center, var(--panel-2) 0%, var(--border-dark) 100%);
  border:3px solid var(--border-light); padding:10px; text-align:center;
  box-shadow:0 0 20px rgba(217,119,87,0.12), inset 0 0 18px rgba(0,0,0,0.4);
}
.creation-preview canvas{ animation: monsterBob 1.6s ease-in-out infinite; }
.creation-options{ flex:1; min-width:0; }
.topbar .hero-avatar{
  width:38px; height:48px; background:var(--panel-2); border:2px solid var(--border-light);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  box-shadow:0 0 8px rgba(217,119,87,0.25);
}
.topbar .hero-info{ display:flex; align-items:center; gap:10px; }
.profile-hero-row{ display:flex; gap:16px; align-items:center; }
.profile-hero-row .creation-preview{ flex:0 0 auto; }

/* ---- Coffres : animations d'ouverture ---- */
.chest-panel{ position:relative; overflow:visible; }
.chest-panel canvas{ position:relative; z-index:1; }
.chest-panel.closed canvas{ animation: chestIdle 2s ease-in-out infinite; }
@keyframes chestIdle{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-3px) rotate(-1deg); } }
.chest-panel.opened canvas{ animation: chestPop 0.5s cubic-bezier(.34,1.56,.64,1); }
@keyframes chestPop{ 0%{ transform:scale(0.6); opacity:0; } 60%{ transform:scale(1.1); opacity:1; } 100%{ transform:scale(1); } }
.chest-panel.opened::before{
  content:""; position:absolute; inset:-30px; z-index:0;
  background:radial-gradient(circle, rgba(255,224,138,0.4) 0%, transparent 70%);
  animation: glowPulse 1.8s ease-in-out infinite;
}
@keyframes glowPulse{ 0%,100%{ opacity:0.5; transform:scale(0.9); } 50%{ opacity:1; transform:scale(1.12); } }
.item-row{ animation: screenIn 0.3s ease both; }
</style>

<body>
<div id="app"></div>

<script>
/* =========================================================================
   FitRPG — moteur condensé pour la démo navigateur (logique identique à
   src/engine/** du projet complet, réécrite en JS vanille auto-suffisant
   pour tourner sans étape de build).
   ========================================================================= */

// ---- Données : exercices ----
const EXERCISES = {
  pompes:   { label:'Pompes',    baseReps:3, growth:1.07 },
  tractions:{ label:'Tractions', baseReps:1, growth:1.07 },
  squats:   { label:'Squats',    baseReps:5, growth:1.08 },
  dips:     { label:'Dips',      baseReps:2, growth:1.07 },
};
const CATEGORIES = Object.keys(EXERCISES);

// ---- Données : monstres ----
const MONSTER_TIERS = {
  weak:  [ {id:'goblin',name:'Gobelin',hpM:0.85}, {id:'slime',name:'Slime',hpM:0.75}, {id:'rat',name:'Rat Géant',hpM:0.8}, {id:'bat',name:'Chauve-souris',hpM:0.7}, {id:'spider',name:'Araignée',hpM:0.9}, {id:'wolf',name:'Loup',hpM:0.95} ],
  medium:[ {id:'orc',name:'Orc',hpM:1.1}, {id:'troll',name:'Troll',hpM:1.25}, {id:'ogre',name:'Ogre',hpM:1.3}, {id:'skeleton',name:'Guerrier Squelette',hpM:1.05}, {id:'corrupted',name:'Chevalier Corrompu',hpM:1.2}, {id:'sorcerer',name:'Sorcier',hpM:1.15} ],
  strong:[ {id:'dragon',name:'Dragon',hpM:1.6}, {id:'demon',name:'Démon',hpM:1.55}, {id:'golem',name:'Golem',hpM:1.5}, {id:'titan',name:'Titan',hpM:1.7}, {id:'kraken',name:'Kraken',hpM:1.65}, {id:'phoenix',name:'Phénix',hpM:1.6} ],
};
const PHASE_TIER = {1:'weak',2:'weak',3:'medium',4:'strong'};
const PHASE_REP_MULT = {1:1, 2:1.15, 3:1.35, 4:1.6};

function pickMonster(tier, seed){ const pool=MONSTER_TIERS[tier]; return pool[seed % pool.length]; }

// ---- Données : équipement / rareté ----
const RARITIES = {
  common:{label:'Commun', color:'var(--common)', weight:60},
  rare:{label:'Rare', color:'var(--rare)', weight:27},
  epic:{label:'Épique', color:'var(--epic)', weight:11},
  legendary:{label:'Légendaire', color:'var(--legendary)', weight:2},
};
const EQUIPMENT_POOL = {
  helmet:[ {id:'h1',name:'Casque du Chevalier',rarity:'common'}, {id:'h2',name:'Casque Dragon',rarity:'epic'}, {id:'h3',name:'Bonnet du Père Noël',rarity:'rare'}, {id:'h4',name:'Couronne Royale',rarity:'legendary'}, {id:'h5',name:'Capuche de Cuir',rarity:'common'} ],
  armor:[ {id:'a1',name:'Armure Royale',rarity:'epic'}, {id:'a2',name:'Armure Sombre',rarity:'rare'}, {id:'a3',name:'Armure Légendaire',rarity:'legendary'}, {id:'a4',name:'Tunique de Voyageur',rarity:'common'} ],
  cape:[ {id:'c1',name:'Cape Écarlate',rarity:'common'}, {id:'c2',name:'Cape des Ombres',rarity:'epic'}, {id:'c3',name:'Cape du Phénix',rarity:'legendary'} ],
  accessory:[ {id:'x1',name:'Épaulières de Fer',rarity:'common'}, {id:'x2',name:'Médaille du Vainqueur',rarity:'rare'}, {id:'x3',name:'Amulette Ancienne',rarity:'epic'} ],
};
const SLOTS = Object.keys(EQUIPMENT_POOL);
function rollRarity(){
  const roll = Math.random()*100; let cum=0;
  for(const [id,r] of Object.entries(RARITIES)){ cum+=r.weight; if(roll<=cum) return id; }
  return 'common';
}
function itemsOfRarity(slot, rarity){ return EQUIPMENT_POOL[slot].filter(i=>i.rarity===rarity); }

/* =========================================================================
   MOTEUR DE PIXEL ART (canvas, calques recolorables)
   -------------------------------------------------------------------------
   Chaque sprite est décrit comme une liste de rectangles sur une grille
   logique (ex: 16x20 pour le héros, 16x16 pour les monstres). Cette
   approche "vecteur bloc par bloc" évite les erreurs d'alignement du
   pixel-art tapé caractère par caractère tout en donnant un vrai rendu
   pixelisé net (image-rendering:pixelated) une fois rasterisé sur canvas.
   Chaque calque peut être reteinté indépendamment -> personnalisation
   (peau/cheveux/équipement) = simple changement de palette, pas de
   nouveau dessin.
   ========================================================================= */
function darken(hex, factor){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.floor(((n>>16)&255) * factor));
  const g = Math.max(0, Math.floor(((n>>8)&255) * factor));
  const b = Math.max(0, Math.floor((n&255) * factor));
  return `rgb(${r},${g},${b})`;
}
function lighten(hex, factor){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.floor(((n>>16)&255) * factor));
  const g = Math.min(255, Math.floor(((n>>8)&255) * factor));
  const b = Math.min(255, Math.floor((n&255) * factor));
  return `rgb(${r},${g},${b})`;
}

// layers: [{ rects:[[x,y,w,h,colorKey], ...], palette:{colorKey:hex} }, ...]
function drawSprite(canvas, layers, gridW, gridH, cell){
  const ctx = canvas.getContext('2d');
  canvas.width = gridW*cell; canvas.height = gridH*cell;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  layers.forEach(layer=>{
    if(!layer) return;
    layer.rects.forEach(([x,y,w,h,key])=>{
      ctx.fillStyle = layer.palette[key];
      ctx.fillRect(x*cell, y*cell, w*cell, h*cell);
    });
  });
}

// ---- Héros : grille logique 16 (largeur) x 20 (hauteur) ----
const HERO_GRID = {w:16, h:20};
const HERO_OUTLINE = '#1c140f';

function heroBaseRects(skinHex, shirtHex, pantsHex, bootsHex){
  const skinShade = darken(skinHex, 0.82);
  return {
    palette:{
      skin:skinHex, skinShade, eye:HERO_OUTLINE, brow:darken(skinHex,0.45),
      shirt:shirtHex, shirtLight:lighten(shirtHex,1.25), shade:darken(shirtHex,0.6),
      pants:pantsHex, pantsShade:darken(pantsHex,0.75),
      boots:bootsHex, bootsLight:lighten(bootsHex,1.4), buckle:'#c9a227',
    },
    rects:[
      [5,1,6,5,'skin'],           // tête
      [5,1,6,1,'skinShade'],      // ombre racine des cheveux
      [6,2,1,1,'brow'], [9,2,1,1,'brow'], // sourcils
      [6,3,1,1,'eye'], [9,3,1,1,'eye'],   // yeux
      [7,4,2,1,'skinShade'],      // ombre du nez
      [7,5,2,1,'brow'],           // bouche
      [7,6,2,1,'skin'],           // cou
      [4,7,8,6,'shirt'],          // torse
      [4,7,2,1,'shirtLight'],     // reflet épaule
      [2,7,2,5,'shirt'], [12,7,2,5,'shirt'], // manches
      [2,11,2,1,'shade'], [12,11,2,1,'shade'], // ombre poignets
      [2,12,2,2,'skin'], [12,12,2,2,'skin'], // mains
      [4,13,8,1,'shade'],         // ceinture

function renderHero(canvas, {skinLabel, hairStyle, hairColorLabel, tunicLabel, equipped}, cell=8){
  const skinHex = SKIN_TONE_HEX[skinLabel] || SKIN_TONE_HEX['Médium'];
  const hairHex = HAIR_COLOR_HEX[hairColorLabel] || HAIR_COLOR_HEX['Brun'];
  const tunicHex = TUNIC_COLOR_HEX[tunicLabel] || TUNIC_COLOR_HEX['Cuir'];
  const eq = equipped || {};
  const armorVis = eq.armor ? ITEM_VISUALS[eq.armor] : null;
  const helmetVis = eq.helmet ? ITEM_VISUALS[eq.helmet] : null;
  const capeVis = eq.cape ? ITEM_VISUALS[eq.cape] : null;
  const accVis = eq.accessory ? ITEM_VISUALS[eq.accessory] : null;

  const layers = [];
  if(capeVis) layers.push(capeLayer(capeVis.color));
  layers.push(heroBaseRects(skinHex, tunicHex, PANTS_DEFAULT, BOOTS_DEFAULT));
  if(armorVis) layers.push(armorLayer(armorVis.color, armorVis.accent));
  if(helmetVis) layers.push(helmetLayer(helmetVis.archetype, helmetVis.color, helmetVis.accent));
  else layers.push(hairLayer(hairStyle, hairHex));
  if(accVis) layers.push(accessoryLayer(accVis.color));

  drawSprite(canvas, layers, HERO_GRID.w, HERO_GRID.h, cell);
}

// ---- Génération procédurale des 100 donjons ----
const DUNGEONS_PER_CATEGORY = 25;
const DUNGEON_NAMES = {
  pompes:['Antre du Gobelin','Grotte Humide','Ruines Oubliées','Forêt Maudite',"Repaire de l'Orc"],
  tractions:['Tour Effondrée','Falaise du Vent','Donjon Suspendu','Cité des Nuages','Bastion Céleste'],
  squats:['Mines Profondes','Caverne de Pierre','Catacombes','Fosse des Titans','Abîme Rocheux'],
  dips:['Arène Oubliée','Camp Fortifié','Citadelle Sombre','Forge Infernale','Sanctuaire Brisé'],
};
function romanNumeral(n){ return ['I','II','III','IV','V','VI','VII'][n-1] || n; }
function dungeonName(cat, idx){
  const pool = DUNGEON_NAMES[cat]; const base = pool[(idx-1)%pool.length];
  const tier = Math.ceil(idx/5);
  return tier===1 ? base : `${base} ${romanNumeral(tier)}`;
}
function round(n){ return Math.max(1, Math.round(n)); }

function generateDungeon(category, idx){
  const ex = EXERCISES[category];
  const phases = [1,2,3,4].map(phase=>{
    const tierName = PHASE_TIER[phase];
    const seed = idx*7 + phase*3;
    const monsterTpl = pickMonster(tierName, seed);
    const baseline = ex.baseReps * Math.pow(ex.growth, idx-1);
    const reps = round(baseline * PHASE_REP_MULT[phase]);
    const hp = reps; // les PV du monstre correspondent exactement au nombre de répétitions à faire
    return {
      phase, isBoss: phase===4,
      monster: {...monsterTpl, maxHp:hp, hp},
      exercise: {category, label:ex.label, repsRequired:reps},
      timeLimitSeconds:60,
      restAfterSeconds: phase<4 ? 60 : 0,
    };
  });
  return {
    id:`${category}_${idx}`, category, indexInCategory:idx,
    name: dungeonName(category, idx),
    phases,
    rewardXp: round(20*Math.pow(1.12, idx-1)),
    chestTier: Math.min(4, 1+Math.floor((idx-1)/6)),
  };
}
function generateAllDungeons(){
  const all=[];
  for(const cat of CATEGORIES) for(let i=1;i<=DUNGEONS_PER_CATEGORY;i++) all.push(generateDungeon(cat,i));
  return all;
}
const ALL_DUNGEONS = generateAllDungeons();

// ---- XP / niveaux (cosmétique uniquement) ----
function xpNeeded(level){ return Math.round(100*Math.pow(1.18, level-1)); }
function grantXp(hero, amount){
  hero.xp += amount; let leveledUp=false;
  while(hero.xp >= xpNeeded(hero.level)){ hero.xp -= xpNeeded(hero.level); hero.level+=1; leveledUp=true; }
  return leveledUp;
}
function xpProgress(hero){
  const needed = xpNeeded(hero.level);
  return { current: hero.xp, needed, ratio: Math.min(1, hero.xp/needed) };
}

// ---- État global du jeu (en mémoire uniquement, pas de localStorage) ----
const state = {
  screen:'creation', // creation | map | combat | rest | chest | inventory | profile
  hero:null,
  progress: Object.fromEntries(CATEGORIES.map(c=>[c,0])), // donjons terminés par catégorie
  dailyClaimedDate:null,
  streak:0,
  run:null, // {dungeon, phaseIndex, monster, secondsRemaining, repsInput, outcome, timerHandle}
  pendingReward:null,
  listModalCategory:null, // null = fermé, 'pompes'/'tractions'/... ou 'all'
  showGiveUpConfirm:false,
  toast:null,
};

function statusOf(dungeon){
  const done = state.progress[dungeon.category];
  if(dungeon.indexInCategory <= done) return 'done';
  if(dungeon.indexInCategory === done+1) return 'open';
  return 'locked';
}
function currentDungeon(category){
  const done = state.progress[category];
  if(done>=DUNGEONS_PER_CATEGORY) return null;
  return ALL_DUNGEONS.find(d=>d.category===category && d.indexInCategory===done+1);
}

function render(){
  const appEl = document.getElementById('app');
  const changed = state._lastScreen !== state.screen;
  appEl.innerHTML='';
  SCREENS[state.screen]();
  if(changed){
    appEl.classList.remove('screen-enter'); void appEl.offsetWidth; appEl.classList.add('screen-enter');
  } else {
    appEl.classList.remove('screen-enter');
  }
  state._lastScreen = state.screen;
}

function heroVisualOptions(){
  const a = state.hero.appearance || {};
  return { skinLabel:a.skin, hairStyle:a.hair, hairColorLabel:a.hairColor, tunicLabel:a.tunic, equipped: state.hero.equipped };
}

      <canvas id="heroAvatarCanvas" class="pixel-canvas hero-avatar"></canvas>
      <div>
        <div class="hero-tag">${state.hero.name} ✎</div>
        <div class="hero-hint">Voir le profil</div>
      </div>
    </button>
    <div class="level-block">
      <div class="level-badge">NIV. ${state.hero.level}</div>
      <div class="xp-track"><div class="bar-fill xp" style="width:${xp.ratio*100}%"></div></div>
      <div class="xp-text">${xp.current} / ${xp.needed} XP</div>
    </div>
  `;
  app.appendChild(top);
  document.getElementById('heroProfileBtn').onclick = ()=>{ state.screen='profile'; render(); };
  renderHero(document.getElementById('heroAvatarCanvas'), heroVisualOptions(), 2.3);

  CATEGORIES.forEach(cat=>{
    const done = state.progress[cat];
    const ratio = done/DUNGEONS_PER_CATEGORY;
    const cur = currentDungeon(cat);
    const card = el('div','panel category-card','');
    card.innerHTML = `
      <div class="row">
        <h2 style="margin:0">${CATEGORY_LABELS[cat]}</h2>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="small muted">${done}/25</span>
          <button class="dots-btn" data-cat="${cat}" title="Voir tous les donjons ${CATEGORY_LABELS[cat]}">•••</button>
        </div>
      </div>
      <div class="bar-track" style="margin-bottom:12px"><div class="bar-fill progress" style="width:${ratio*100}%"></div></div>
      ${cur ? `<div class="dungeon-btn" data-id="${cur.id}"><div class="name">${cur.name}</div><div class="meta">Donjon ${cur.indexInCategory}/25 · Entrer</div></div>`
            : `<div class="small" style="color:var(--ok)">Catégorie entièrement terminée 🎉</div>`}
    `;
    app.appendChild(card);
    if(cur){
      card.querySelector('.dungeon-btn').onclick = ()=> enterDungeon(cur.id);
    }
    card.querySelector('.dots-btn').onclick = ()=>{ state.listModalCategory=cat; render(); };
  });

  app.appendChild(el('div','footer-note','Pixel-art · Médiéval fantastique · 100 donjons · 4 exercices'));
  app.appendChild(dailyBarEl());

  if(state.listModalCategory) renderFullListModal();
}

function dailyBarEl(){
  const claimedToday = state.dailyClaimedDate === todayKey();
  const bar = el('div', `daily-bar ${claimedToday?'claimed':''}`, '');
  bar.innerHTML = claimedToday
    ? `<span class="daily-icon">🔥</span>
       <div>
         <div class="daily-title" style="color:var(--ok)">Récompense du jour obtenue</div>
         <div class="daily-sub claimed">Série de ${state.streak} jour(s) consécutif(s)</div>
       </div>`
    : `<canvas id="dailyChestIcon" class="pixel-canvas daily-icon"></canvas>
       <div>
         <div class="daily-title">Récompense quotidienne</div>
         <div class="daily-sub">Termine un donjon aujourd'hui pour l'obtenir</div>
       </div>`;
  if(!claimedToday){
    requestAnimationFrame(()=>{
      const c = document.getElementById('dailyChestIcon');
      if(c) renderChest(c, 1, false, 2);
    });
  }
  return bar;
}

function renderFullListModal(){
  const overlay = el('div','modal-overlay','');
  const sheet = el('div','modal-sheet','');
  const cat = state.listModalCategory;
  const list = ALL_DUNGEONS.filter(d=>d.category===cat);
  sheet.innerHTML = `<h2>Donjons — ${CATEGORY_LABELS[cat]}</h2>` +
    list.map(d=>{
      const st = statusOf(d);
      const label = st==='done'?'✓ Terminé':st==='open'?'▶ Disponible':'🔒 Verrouillé';
      const cls = st==='done'?'status-done':st==='open'?'status-open':'status-locked';
      return `<div class="list-row"><span>${d.name} <span class="muted">(${d.indexInCategory}/25)</span></span><span class="status-dot ${cls}">${label}</span></div>`;
    }).join('');
  const closeBtn = el('button','block','Fermer');
  closeBtn.style.marginTop='14px';
  sheet.appendChild(closeBtn);
  closeBtn.onclick = ()=>{ state.listModalCategory=null; render(); };
  overlay.appendChild(sheet);
  document.getElementById('app').appendChild(overlay);
}

// ---- Écran : combat ----
function enterDungeon(id){
  const dungeon = ALL_DUNGEONS.find(d=>d.id===id);
  state.run = { dungeon, phaseIndex:0, outcome:null, repsValue:'' };
  startPhase();
  state.screen='combat';
  render();
}
function startPhase(){
  const run = state.run;
  const phaseData = run.dungeon.phases[run.phaseIndex];
  run.monster = { ...phaseData.monster };
  run.secondsRemaining = phaseData.timeLimitSeconds;
  run.outcome = null;
  run.repsValue = '';
  run.hitActive = false;
  clearInterval(run.timerHandle);
  run.timerHandle = setInterval(()=>{
    run.secondsRemaining -= 1;
    if(run.secondsRemaining <= 0){
      clearInterval(run.timerHandle);
      if(!run.outcome) run.outcome='defeat';
    }
    if(state.screen==='combat') render();
  }, 1000);
}
function screenCombat(){
  const app=document.getElementById('app');
  const run = state.run;
  const phaseData = run.dungeon.phases[run.phaseIndex];
  const monster = run.monster;
  const hpRatio = Math.max(0, monster.hp/monster.maxHp);

  const hud = el('div','row-between','');
  hud.innerHTML = `<span class="timer ${run.secondsRemaining<=10?'low':''}">⏱ ${Math.max(0,run.secondsRemaining)}s</span>
                    <span class="small" style="color:var(--lilac)">Phase ${phaseData.phase}/4 ${phaseData.isBoss?'· BOSS':''}</span>`;
  app.appendChild(hud);

  const frame = el('div', `panel monster-frame ${phaseData.isBoss?'boss':''} ${run.hitActive?'hit-active':''}`, '');
  frame.innerHTML = `
    <canvas id="monsterCanvas" class="pixel-canvas"></canvas>
    <div class="monster-name">${monster.name}</div>
    <div class="bar-track"><div class="bar-fill hp" style="width:${hpRatio*100}%"></div></div>
    <div class="hp-label">${monster.hp} / ${monster.maxHp} PV</div>
    ${run.hitActive ? `<div class="dmg-popup">VAINCU !</div>` : ''}
  `;
  app.appendChild(frame);
  renderMonster(document.getElementById('monsterCanvas'), monster.id, phaseData.isBoss ? 11 : 8);

  if(!run.outcome && !run.hitActive){
    const row = el('div','gap','');
    row.innerHTML = `<button class="block" id="validateBtn">J'ai terminé mes ${phaseData.exercise.repsRequired} ${phaseData.exercise.label} ✓</button>
                      <button class="secondary block" id="giveUpBtn">Abandonner le donjon</button>`;
    app.appendChild(row);
    document.getElementById('validateBtn').onclick = ()=> validateReps();
    document.getElementById('giveUpBtn').onclick = ()=> confirmGiveUp();
  } else if(run.outcome==='defeat'){
    const card = el('div','panel center','');
    card.innerHTML = `<h2 style="color:var(--hp)">Défaite...</h2><div class="small muted" style="margin-bottom:12px">Le temps est écoulé.</div>`;
    const btn = el('button','block','Réessayer');
    btn.onclick = ()=>{ startPhase(); render(); };
    card.appendChild(btn);
    app.appendChild(card);
  }

  if(state.showGiveUpConfirm) renderGiveUpModal();
}
function validateReps(){
  const run = state.run;
  // Le joueur confirme avoir réellement fait le nombre de répétitions demandé :
  // le monstre tombe immédiatement (petit flash d'impact) puis on enchaîne sur
  // la récupération (ou le coffre si c'était le boss), sans écran "Victoire".
  run.monster.hp = 0;
  clearInterval(run.timerHandle);
  run.hitActive = true;
  render();
  setTimeout(()=>{ advanceAfterVictory(); }, 420);
}
function confirmGiveUp(){
  state.showGiveUpConfirm = true;
  render();
}
function renderGiveUpModal(){
  const overlay = el('div','modal-overlay','');
  const sheet = el('div','modal-sheet center','');
  sheet.innerHTML = `<h2 style="margin-bottom:10px">Abandonner ?</h2>
    <div class="small muted" style="margin-bottom:18px">Ta progression sur ce donjon sera perdue.</div>`;
  const confirmBtn = el('button','block','Oui, abandonner');
  confirmBtn.style.marginBottom='10px';
  confirmBtn.onclick = ()=>{ state.showGiveUpConfirm=false; giveUpDungeon(); };
  const cancelBtn = el('button','secondary block','Continuer le combat');
  cancelBtn.onclick = ()=>{ state.showGiveUpConfirm=false; render(); };
  sheet.appendChild(confirmBtn);
  sheet.appendChild(cancelBtn);
  overlay.appendChild(sheet);
  document.getElementById('app').appendChild(overlay);
}
function giveUpDungeon(){
  if(state.run) clearInterval(state.run.timerHandle);
  clearInterval(state.restHandle);
  state.run = null;
  state.screen = 'map';
  render();
}
function advanceAfterVictory(){
  const run = state.run;
  const isLast = run.phaseIndex === run.dungeon.phases.length-1;
  if(!isLast){
    const restSeconds = run.dungeon.phases[run.phaseIndex].restAfterSeconds;
    run.phaseIndex += 1;
    state.screen='rest';
    startRest(restSeconds);
  } else {
    state.progress[run.dungeon.category] += 1;
    const leveledUp = grantXp(state.hero, run.dungeon.rewardXp);
    const chest = openableChest(run.dungeon.chestTier, 'dungeon');
    const dailyChest = claimDailyIfNeeded();
    state.pendingReward = { xpGained: run.dungeon.rewardXp, leveledUp, chest, dailyChest };
    state.run = null;
    state.screen='chest';
  }
  render();
}
function startRest(restSeconds){
  state.rest = { remaining: restSeconds };
  clearInterval(state.restHandle);
  state.restHandle = setInterval(()=>{
    state.rest.remaining -= 1;
    if(state.rest.remaining<=0){
      clearInterval(state.restHandle);
      goToNextPhaseNow();
      return;
    }
    if(state.screen==='rest') render();
  }, 1000);
}
function goToNextPhaseNow(){
  if(state.screen!=='rest') return;
  startPhase();
  state.screen='combat';
  render();
}
function screenRest(){
  const app=document.getElementById('app');
  const card = el('div','panel center','');
  const remaining = Math.max(0, state.rest.remaining);
  card.innerHTML = `<h2>Récupération</h2><div class="timer" style="margin:14px 0">${remaining}s</div>
                     <div class="small muted" style="margin-bottom:14px">Reprends ton souffle avant le prochain combat.</div>`;
  app.appendChild(card);

  if(remaining>0){
    const skipBtn = el('button','secondary block','⏭ Passer le temps de récupération');
    skipBtn.style.marginTop='10px';
    skipBtn.onclick = ()=>{ clearInterval(state.restHandle); goToNextPhaseNow(); };
    app.appendChild(skipBtn);
  }

  const giveUpBtn = el('button','secondary block','Abandonner le donjon');
  giveUpBtn.style.marginTop='10px';
  giveUpBtn.onclick = ()=> confirmGiveUp();
  app.appendChild(giveUpBtn);

  if(state.showGiveUpConfirm) renderGiveUpModal();
}

// ---- Coffres / récompenses ----
let chestCounter=0;
function openableChest(tier, source){
  chestCounter+=1;
  return { id:`chest_${chestCounter}`, tier, source, opened:false, contents:[] };
}
function openChestNow(chest){
  if(chest.opened) return chest.contents;
  const rerolls = tier=>({1:1,2:1,3:2,4:2}[tier]||1);
  const items=[];
  for(let i=0;i<rerolls(chest.tier);i++){
    const slot = SLOTS[Math.floor(Math.random()*SLOTS.length)];
    let rarity = rollRarity();
    if(chest.tier>=3 && rarity==='common' && Math.random()<0.4) rarity='rare';
    const candidates = itemsOfRarity(slot, rarity);
    const pool = candidates.length?candidates:EQUIPMENT_POOL[slot];
    const item = pool[Math.floor(Math.random()*pool.length)];
    items.push({...item, slot});
  }
  chest.opened=true; chest.contents=items;
  items.forEach(it=>{ if(!state.hero.inventory.includes(it.id)) state.hero.inventory.push(it.id); });
  return items;
}
function todayKey(){ return new Date().toISOString().slice(0,10); }
function claimDailyIfNeeded(){
  const today = todayKey();
  if(state.dailyClaimedDate===today) return null;
  const wasYesterday = state.dailyClaimedDate && (new Date(today)-new Date(state.dailyClaimedDate))/86400000===1;
  state.streak = wasYesterday ? state.streak+1 : 1;
  state.dailyClaimedDate = today;
  const tier = state.streak>=30?4:state.streak>=14?3:state.streak>=7?2:1;
  return openableChest(tier,'daily');
}

const ICON_SHAPES = {
  helmet: [ [1,2,6,2,'fill'],[0,4,8,1,'fill'],[1,1,6,1,'light'] ],
  armor: [ [1,0,6,7,'fill'],[1,0,6,1,'light'],[0,2,1,4,'fill'],[7,2,1,4,'fill'] ],
  cape: [ [1,0,6,1,'fill'],[0,1,8,5,'fill'],[1,6,6,1,'fill'] ],
  accessory: [ [3,0,2,1,'fill'],[2,1,4,1,'fill'],[1,2,6,2,'fill'],[2,4,4,1,'fill'],[3,5,2,1,'fill'] ],
};
function renderItemIcon(canvas, slot, colorHex, cell=4){
  const rects = ICON_SHAPES[slot] || ICON_SHAPES.accessory;
  const palette = { fill:colorHex, light: lighten(colorHex,1.35) };
  drawSprite(canvas, [{palette, rects}], 8, 8, cell);
}

function screenChest(){
  const app=document.getElementById('app');
  const reward = state.pendingReward;
  const card = el('div','panel center','');
  card.innerHTML = `${reward.leveledUp?`<h2 style="color:var(--ember)">Niveau supérieur ! Niv. ${state.hero.level} 🎉</h2>`:''}
    <h1>Donjon terminé !</h1>
    <div class="small" style="color:var(--ok);margin:10px 0">+${reward.xpGained} XP</div>`;
  app.appendChild(card);

  if(!reward.chest.opened){
    const chestCard = el('div','panel center chest-panel closed','');
    chestCard.innerHTML = `<canvas id="chestCanvas" class="pixel-canvas"></canvas>`;
    const btn = el('button','block','Ouvrir le coffre');
    btn.style.marginTop='14px';
    btn.onclick = ()=>{ openChestNow(reward.chest); if(reward.dailyChest) openChestNow(reward.dailyChest); render(); };
    chestCard.appendChild(btn);
    app.appendChild(chestCard);
    renderChest(document.getElementById('chestCanvas'), reward.chest.tier, false, 10);
  } else {
    const openCard = el('div','panel center chest-panel opened','');
    openCard.innerHTML = `<canvas id="chestCanvasOpen" class="pixel-canvas"></canvas>`;
    app.appendChild(openCard);
    renderChest(document.getElementById('chestCanvasOpen'), reward.chest.tier, true, 10);

    const list = el('div','panel','');
    list.appendChild(el('h3','', 'Objets obtenus'));
    list.style.marginTop='12px';
    reward.chest.contents.forEach(item=> list.appendChild(itemRowEl(item)));
    if(reward.dailyChest && reward.dailyChest.contents.length){
      const dailyLabel = el('div','small','');
      dailyLabel.style.cssText='color:var(--ember);margin:10px 0 6px';
      dailyLabel.textContent = `🔥 Récompense quotidienne (série de ${state.streak})`;
      list.appendChild(dailyLabel);
      reward.dailyChest.contents.forEach(item=> list.appendChild(itemRowEl(item)));
    }
    app.appendChild(list);
    const btn = el('button','block','Retour à la carte');
    btn.style.marginTop='10px';
    btn.onclick = ()=>{ state.pendingReward=null; state.screen='map'; render(); };
    app.appendChild(btn);
  }
}
function itemRowEl(item){
  const r = RARITIES[item.rarity];
  const vis = ITEM_VISUALS[item.id] || {color:r.color};
  const row = el('div','item-row','');
  row.style.borderColor = r.color;
  row.innerHTML = `
    <span style="display:flex;align-items:center;gap:10px">
      <canvas class="pixel-canvas item-icon"></canvas>
      <span>${item.name}</span>
    </span>
    <span class="rarity-tag" style="color:${r.color}">${r.label}</span>
  `;
  renderItemIcon(row.querySelector('canvas'), item.slot, vis.color, 4);
  return row;
}

// ---- Profil : renommer le héros + gérer l'équipement ----
function screenProfile(){
  const app=document.getElementById('app');
  app.appendChild(el('div','', `<h1 style="margin-bottom:14px">Profil du héros</h1>`));

  const heroRow = el('div','profile-hero-row','');
  const preview = el('div','panel creation-preview','<canvas id="profileHeroCanvas" class="pixel-canvas"></canvas>');
  const renameCard = el('div','panel','');
  renameCard.style.flex = '1';
  renameCard.innerHTML = `<h3 style="margin-bottom:8px">Pseudo</h3>
    <input id="renameInput" type="text" value="${state.hero.name}" placeholder="Nom du héros"/>`;
  heroRow.appendChild(preview);
  heroRow.appendChild(renameCard);
  app.appendChild(heroRow);
  const renameInput = document.getElementById('renameInput');
  renameInput.oninput = e=>{ state.hero.name = e.target.value; };
  renderHero(document.getElementById('profileHeroCanvas'), heroVisualOptions(), 8);

  const levelCard = el('div','panel','');
  const xp = xpProgress(state.hero);
  levelCard.innerHTML = `<h3 style="margin-bottom:8px">Progression</h3>
    <div class="small">Niveau ${state.hero.level}</div>
    <div class="xp-track" style="margin-top:6px"><div class="bar-fill xp" style="width:${xp.ratio*100}%"></div></div>
    <div class="xp-text">${xp.current} / ${xp.needed} XP</div>`;
  app.appendChild(levelCard);

  app.appendChild(el('h2','', 'Équipement'));
  const SLOT_LABELS={helmet:'Casque',armor:'Armure',cape:'Cape',accessory:'Accessoire'};
  SLOTS.forEach(slot=>{
    const owned = state.hero.inventory.filter(id=>EQUIPMENT_POOL[slot].some(i=>i.id===id));
    const section = el('div','panel','');
    section.innerHTML = `<h3 style="margin-bottom:8px">${SLOT_LABELS[slot]}</h3>`;
    const chipRow = el('div','chip-row','');
    const noneChip = el('div', `chip ${!state.hero.equipped[slot]?'active':''}`, 'Aucun');
    noneChip.onclick = ()=>{ state.hero.equipped[slot]=null; render(); };
    chipRow.appendChild(noneChip);
    owned.forEach(id=>{
      const item = EQUIPMENT_POOL[slot].find(i=>i.id===id);
      const vis = ITEM_VISUALS[id] || {color:RARITIES[item.rarity].color};
      const active = state.hero.equipped[slot]===id;
      const chip = el('div', `chip ${active?'active':''}`, '');
      chip.style.cssText = `border-color:${RARITIES[item.rarity].color}; display:flex; align-items:center; gap:6px;`;
      chip.innerHTML = `<canvas class="pixel-canvas item-icon"></canvas><span>${item.name}</span>`;
      renderItemIcon(chip.querySelector('canvas'), slot, vis.color, 3);
      chip.onclick = ()=>{ state.hero.equipped[slot]=id; render(); };
      chipRow.appendChild(chip);
    });
    section.appendChild(chipRow);
    if(owned.length===0) section.appendChild(el('div','small muted','Aucun objet obtenu pour ce slot.'));
    app.appendChild(section);
  });

  const btn = el('button','block','Retour à la carte');
  btn.onclick = ()=>{
    state.hero.name = (renameInput.value || '').trim() || state.hero.name || 'Héros';
    state.screen='map'; render();
  };
  app.appendChild(btn);
}

// ---- helpers DOM ----
function el(tag, className, html){ const e=document.createElement(tag); if(className) e.className=className; if(html) e.innerHTML=html; return e; }

const SCREENS = { creation:screenCreation, map:screenMap, combat:screenCombat, rest:screenRest, chest:screenChest, profile:screenProfile };

render();
</script>
